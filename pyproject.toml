[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "drugforge"
version = "0.1.0"
description = "Multitask framework for drug-target affinity prediction and drug generation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torch-geometric>=2.3.0",
    "torch-scatter",
    "torch-sparse",
    "rdkit-pypi>=2022.9.1",
    "selfies>=2.1.1",
    "pandas>=1.5.0",
    "numpy>=1.23.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "tqdm>=4.64.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
api = ["fastapi>=0.100.0", "uvicorn[standard]>=0.22.0", "pydantic>=2.0.0"]
esm = ["fair-esm"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
drugforge = "drugforge.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["drugforge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
